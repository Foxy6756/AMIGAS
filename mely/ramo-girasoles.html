<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo de girasoles</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #271a0f, #170d06 52%, #0c0603);
      perspective: 1000px;
    }
    .glow {
      position: fixed;
      width: min(90vw, 680px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #f59e0b29, #d977060f 45%, transparent 70%);
      filter: blur(35px);
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .bouquet {
      position: relative;
      width: min(92vw, 560px);
      max-height: 96vh;
      animation: sway 7s ease-in-out infinite;
      transform-origin: bottom center;
      filter: drop-shadow(0 25px 35px #000a);
    }
    svg { display: block; width: 100%; height: auto; }
    .flower { transform-box: fill-box; transform-origin: center; transition: transform .4s ease; }
    .flower:hover { transform: scale(1.07) rotate(3deg); }
    @keyframes pulse { to { transform: scale(1.1); opacity: .8; } }
    @keyframes sway {
      25% { transform: rotate(1.2deg) translateY(-4px); }
      50% { transform: rotate(-.8deg) translateY(2px); }
      75% { transform: rotate(1.6deg) translateY(-2px); }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="bouquet">
    <svg viewBox="0 0 650 820" role="img" aria-label="Ramo de siete girasoles">
      <defs>
        <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fef9c3"/><stop offset=".35" stop-color="#fbbf24"/>
          <stop offset=".78" stop-color="#d97706"/><stop offset="1" stop-color="#854d0e"/>
        </linearGradient>
        <radialGradient id="core"><stop stop-color="#160902"/><stop offset=".55" stop-color="#4a220b"/><stop offset="1" stop-color="#d97706"/></radialGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ade80"/><stop offset=".5" stop-color="#16a34a"/><stop offset="1" stop-color="#064e3b"/></linearGradient>
        <linearGradient id="paper"><stop stop-color="#debb91"/><stop offset=".5" stop-color="#ba8e5c"/><stop offset="1" stop-color="#69441e"/></linearGradient>
        <linearGradient id="ribbon"><stop stop-color="#f87171"/><stop offset=".4" stop-color="#dc2626"/><stop offset="1" stop-color="#550a0a"/></linearGradient>
        <linearGradient id="lilyPetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset=".55" stop-color="#f9a8d4"/><stop offset="1" stop-color="#be6b9d"/></linearGradient>
        <g id="lilyHead">
          <g fill="url(#lilyPetal)" stroke="#a85578" stroke-width="1.2">
            <path d="M0 5C-35-5-58-34-48-70C-20-66-2-35 0 5Z"/><path d="M0 5C35-5 58-34 48-70C20-66 2-35 0 5Z"/><path d="M0 5C-10-28-8-62 0-88C8-62 10-28 0 5Z"/>
            <path d="M0 5C-47-1-72-22-78-48C-47-54-16-32 0 5Z"/><path d="M0 5C47-1 72-22 78-48C47-54 16-32 0 5Z"/>
          </g>
          <g stroke="#fef08a" stroke-width="2" stroke-linecap="round"><path d="M-4 0L-35-43"/><path d="M4 0L35-43"/><path d="M0 0L0-56"/></g>
          <circle cy="4" r="7" fill="#fef3c7" stroke="#a85578"/>
        </g>
        <path id="petalShape" d="M0 0C-9-25-14-72 0-104C14-72 9-25 0 0Z"/>
        <g id="flowerHead">
          <g fill="url(#petal)" stroke="#92400e" stroke-width=".8">
            <use href="#petalShape"/><use href="#petalShape" transform="rotate(15)"/><use href="#petalShape" transform="rotate(30)"/><use href="#petalShape" transform="rotate(45)"/>
            <use href="#petalShape" transform="rotate(60)"/><use href="#petalShape" transform="rotate(75)"/><use href="#petalShape" transform="rotate(90)"/><use href="#petalShape" transform="rotate(105)"/>
            <use href="#petalShape" transform="rotate(120)"/><use href="#petalShape" transform="rotate(135)"/><use href="#petalShape" transform="rotate(150)"/><use href="#petalShape" transform="rotate(165)"/>
            <use href="#petalShape" transform="rotate(180)"/><use href="#petalShape" transform="rotate(195)"/><use href="#petalShape" transform="rotate(210)"/><use href="#petalShape" transform="rotate(225)"/>
            <use href="#petalShape" transform="rotate(240)"/><use href="#petalShape" transform="rotate(255)"/><use href="#petalShape" transform="rotate(270)"/><use href="#petalShape" transform="rotate(285)"/>
            <use href="#petalShape" transform="rotate(300)"/><use href="#petalShape" transform="rotate(315)"/><use href="#petalShape" transform="rotate(330)"/><use href="#petalShape" transform="rotate(345)"/>
          </g>
          <circle r="47" fill="url(#core)" stroke="#1a0b03" stroke-width="1.5"/>
          <circle r="39" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="2 6"/>
          <circle r="28" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="2 5"/>
          <circle r="7" fill="#140701"/>
        </g>
      </defs>

      <g stroke="#14532d" stroke-width="14" stroke-linecap="round" fill="none">
        <path d="M305 360Q320 530 325 720"/><path d="M250 340Q285 520 310 720"/>
        <path d="M400 350Q360 530 340 725"/><path d="M200 320Q250 500 300 710"/><path d="M450 320Q390 500 350 715"/>
      </g>
      <g fill="url(#leaf)" stroke="#064e3b" stroke-width="1.5">
        <path d="M220 350C120 340 75 270 50 195C120 195 200 260 235 340Z"/>
        <path d="M430 350C530 340 575 270 600 190C530 190 450 260 415 340Z"/>
        <path d="M155 250C100 185 130 130 145 110C170 155 175 200 160 245Z"/>
        <path d="M495 250C550 185 520 130 505 110C480 155 475 200 490 245Z"/>
      </g>
      <g stroke="#166534" stroke-width="9" stroke-linecap="round" fill="none"><path d="M170 350Q190 470 275 700"/><path d="M480 350Q450 470 375 700"/><path d="M325 315Q325 500 325 710"/></g>
      <g class="flower" transform="translate(170 315) scale(.8) rotate(-12)"><use href="#lilyHead"/></g>
      <g class="flower" transform="translate(480 315) scale(.8) rotate(12)"><use href="#lilyHead"/></g>
      <g class="flower" transform="translate(325 255) scale(.72)"><use href="#lilyHead"/></g>
      <path d="M150 390H500L415 640H235Z" fill="#24160a" opacity=".9"/>
      <g class="flower" transform="translate(210 195) scale(.96) rotate(-16)"><use href="#flowerHead"/></g>
      <g class="flower" transform="translate(440 195) scale(.96) rotate(16)"><use href="#flowerHead"/></g>
      <g class="flower" transform="translate(325 130) scale(1.02) rotate(4)"><use href="#flowerHead"/></g>
      <g class="flower" transform="translate(225 320) scale(1.08) rotate(-8)"><use href="#flowerHead"/></g>
      <g class="flower" transform="translate(425 320) scale(1.08) rotate(10)"><use href="#flowerHead"/></g>
      <g class="flower" transform="translate(325 270) scale(1.26) rotate(-2)"><use href="#flowerHead"/></g>
      <g class="flower" transform="translate(325 395) scale(.8) rotate(180)"><use href="#flowerHead"/></g>

      <path d="M125 370C175 430 220 540 265 700C300 705 350 705 385 700C430 540 475 430 525 370C475 395 410 420 325 420C240 420 175 395 125 370Z" fill="#694723" opacity=".75"/>
      <path d="M115 365C185 410 250 465 278 702L340 706C315 530 240 420 160 345Z" fill="url(#paper)" stroke="#573719"/>
      <path d="M535 365C465 410 400 465 372 702L282 704C310 535 410 415 490 345Z" fill="url(#paper)" stroke="#4d2f14"/>
      <g transform="translate(325 595)" fill="url(#ribbon)" stroke="#660d0d" stroke-width="1">
        <path d="M-16 12C-48 65-70 120-80 165C-58 138-32 105-10 44Z"/><path d="M16 12C48 65 70 120 80 165C58 138 32 105 10 44Z"/>
        <path d="M0 0C-55-44-125-22-115 28C-104 72-38 33 0 9Z"/><path d="M0 0C55-44 125-22 115 28C104 72 38 33 0 9Z"/>
        <ellipse cy="5" rx="17" ry="14"/>
      </g>
    </svg>
  </div>
</body>
</html>
